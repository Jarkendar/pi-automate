services:
  n8n:
    image: n8nio/n8n:2.13.2
    container_name: n8n_pi_automate
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows
      - ./scripts:/home/node/scripts
    networks:
      - n8n-network

  n8n-python-runner:
    build: ./runner
    container_name: n8n_worker
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n_pi_automate:5679
    env_file:
      - .env
    networks:
      - n8n-network
    depends_on:
      - n8n

  speaches:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    container_name: whisper_api
    restart: unless-stopped
    ports:
      - "8888:8000"
    environment:
      - PRELOAD_MODELS=["Systran/faster-whisper-small"]
      - WHISPER__COMPUTE_TYPE=int8
      - HOST=0.0.0.0
    volumes:
      - ./whisper_models:/root/.cache/huggingface
    networks:
      - n8n-network

  ngrok:
      image: ngrok/ngrok:latest
      container_name: ngrok_tunnel
      restart: unless-stopped
      env_file:
        - .env
      command: http --domain=${NGROK_DOMAIN} n8n_pi_automate:5678
      networks:
        - n8n-network
  courses-hub:
    build: ./courses_hub_backend
    container_name: courses_hub_pi_automate
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/data/courses.db
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://courses.lan,http://localhost
      - N8N_WEBHOOK_URL=${COURSES_HUB_N8N_WEBHOOK_URL:-}
    volumes:
      - ./courses_data:/data
    networks:
      - n8n-network

  courses-caddy:
    image: caddy:2-alpine
    container_name: courses_caddy_pi_automate
    restart: unless-stopped
    ports:
      - "80:80"
    env_file:
      - .env
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./courses_patched:/srv/courses:ro
      - ./courses_hub_frontend:/srv/frontend:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on:
      - courses-hub
    networks:
      - n8n-network
networks:
  n8n-network:
    driver: bridge